name: Verify Node and Cloudflare staging
on:
  push:
    branches: [main, codex/cloudflare-staging, codex/render-staging]
  pull_request:
permissions:
  contents: read
concurrency:
  group: staging-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_only
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_only -d ci_only"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SQL_HOST: 127.0.0.1
      SQL_DB_NAME: ci_only
      SQL_USER: ci_only
      SQL_PASSWORD: ci_only
      SQL_ADMIN_USER: ci_only
      SQL_ADMIN_PASSWORD: ci_only
      ALLOW_INDEXING: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Generate isolated CI secret
        run: node -e "const s=require('crypto').randomBytes(32).toString('hex');console.log('::add-mask::'+s);require('fs').appendFileSync(process.env.GITHUB_ENV, 'PAYLOAD_SECRET='+s+'\n')"
      - run: bun run payload:types
      - run: git diff --exit-code -- src/payload-types.ts
      - run: bun run test
      - run: bun run typecheck
      - run: bun run cf:check
      - run: bun run db:migrate
      - run: bunx tsx scripts/ci-pool-smoke.ts
      - run: bun run db:seed
      - run: bunx tsx scripts/ci-fixture.ts
      - run: bun run build
        if: github.ref_name != 'codex/render-staging' && github.head_ref != 'codex/render-staging'
      - run: node scripts/ci-node-smoke.mjs
        if: github.ref_name != 'codex/render-staging' && github.head_ref != 'codex/render-staging'
      - name: Verify Render build, admin and private S3 storage
        if: github.ref_name == 'codex/render-staging' || github.head_ref == 'codex/render-staging'
        env:
          RENDER: 'true'
          RENDER_EXTERNAL_URL: https://ci-render.onrender.com
          DEPLOYMENT_STAGE: staging
          ALLOW_INDEXING: 'true'
          SQL_USER: ci_app
          SQL_PASSWORD: ci_app_only
          PORT: '10000'
          R2_BUCKET: ci-render-private
          R2_ENDPOINT: http://127.0.0.1:5000
          R2_ACCESS_KEY_ID: ci_only
          R2_SECRET_ACCESS_KEY: ci_only
        run: |
          set -euo pipefail
          python3 -m venv .ci/s3-venv
          .ci/s3-venv/bin/pip -q install 'moto[server]==5.1.22'
          .ci/s3-venv/bin/moto_server -H 127.0.0.1 -p 5000 > .ci/s3.log 2>&1 &
          s3_pid=$!
          trap 'kill "$s3_pid"' EXIT
          curl --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused "$R2_ENDPOINT" >/dev/null
          .ci/s3-venv/bin/python - <<'PY'
          import mimetypes
          import os
          from pathlib import Path
          import boto3

          s3 = boto3.client('s3', endpoint_url=os.environ['R2_ENDPOINT'], region_name='us-east-1',
                            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
                            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'])
          bucket = os.environ['R2_BUCKET']
          s3.create_bucket(Bucket=bucket)
          for image in Path('media').iterdir():
              if image.is_file():
                  s3.upload_file(str(image), bucket, image.name,
                                 ExtraArgs={'ContentType': mimetypes.guess_type(image)[0] or 'application/octet-stream'})
          PY
          mv media .ci/seed-media
          bun run build
          node scripts/ci-render-smoke.mjs
          # Restore the input for the separate Workers emulator smoke test.
          mkdir -p media
          cp -a .ci/seed-media/. media/
      - run: bun run cf:build
      - name: Exercise OpenNext deployment preflight without deploying
        # Use the real deploy command and project config, not the smoke-test
        # config that already supplies a working local Hyperdrive connection.
        run: bun run cf:deploy --dry-run --outdir artifacts/worker
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: worker-preview-build
          path: artifacts/worker
          retention-days: 7
      - run: node scripts/ci-worker-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cloudflare-test-evidence
          path: .ci/results.json
          retention-days: 7
