name: Verify Cloudflare preparation
on:
  push:
    branches: [codex/cloudflare-staging]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_only
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_only -d ci_only"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SQL_HOST: 127.0.0.1
      SQL_DB_NAME: ci_only
      SQL_USER: ci_only
      SQL_PASSWORD: ci_only
      SQL_ADMIN_USER: ci_only
      SQL_ADMIN_PASSWORD: ci_only
      ALLOW_INDEXING: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Resolve lock on the supported Linux build environment
        run: bun install --lockfile-only
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-lock
          path: bun.lock
      - run: bun install --frozen-lockfile
      - name: Generate isolated CI secret
        run: node -e "const s=require('crypto').randomBytes(32).toString('hex');console.log('::add-mask::'+s);require('fs').appendFileSync(process.env.GITHUB_ENV, 'PAYLOAD_SECRET='+s+'\n')"
      - run: bun run payload:types
      - uses: actions/upload-artifact@v4
        with:
          name: payload-types
          path: src/payload-types.ts
      - run: bun run test
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bunx tsx scripts/ci-fixture.ts
      - run: bun run build
      - run: node scripts/ci-node-smoke.mjs
      - run: bun run cf:build
      - name: Package Worker without deploying
        run: bunx wrangler deploy --dry-run --outdir artifacts/worker
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: worker-preview-build
          path: artifacts/worker
      - run: node scripts/ci-worker-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cloudflare-test-evidence
          path: .ci/results.json
